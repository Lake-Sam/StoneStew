name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            make
            perl
            python
            python-pip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-pcre
            mingw-w64-x86_64-python-yaml

      - name: Build local tiles
        run: |
          cd crawl-ref/source
          make -j2 TILES=y

      - name: Validate map database
        shell: pwsh
        run: .\tools\stone-stew-dev.ps1 check

      - name: Install Inno Setup
        shell: pwsh
        run: winget install --id JRSoftware.InnoSetup --source winget --silent --accept-source-agreements --accept-package-agreements

      - name: Package Windows build
        shell: pwsh
        run: .\tools\package-stone-stew.ps1 -Version "${{ github.ref_name }}" -Configuration win64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoneStew-${{ github.ref_name }}-win64
          path: |
            dist/StoneStew-${{ github.ref_name }}-win64.zip
            dist/StoneStew-${{ github.ref_name }}-win64-Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StoneStew-${{ github.ref_name }}-win64.zip
            dist/StoneStew-${{ github.ref_name }}-win64-Setup.exe
          body: |
            Early Stone Stew Windows tiles build.

            Run the setup `.exe`, or unzip the archive and run `Start Stone Stew.bat` or `crawl.exe`.
